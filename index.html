<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04070c">
<meta name="description" content="DREADNOUGHT — a horror roguelike deckbuilder. Pilot a Russian submarine into an abyssal trench; read the dark with sonar before it reads you.">
<title>DREADNOUGHT — descent into the trench</title>
<style>
  html, body { margin: 0; height: 100%; background: #04070c; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
  #c { display: block; width: 100vw; height: 100vh; cursor: pointer; image-rendering: pixelated; }
  #dev { position: fixed; top: 4px; left: 4px; color: #27e89a; font: 12px monospace;
    background: rgba(0,0,0,0.5); padding: 2px 5px; display: none; z-index: 10; pointer-events: none; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #27e89a; font: bold 18px 'Courier New', monospace; background: #04070c; z-index: 5; letter-spacing: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dev"></div>
<div id="boot">DREADNOUGHT — PRESSURIZING…</div>
<script src="./strings.js"></script>
<script src="./rng.js"></script>
<script src="./data.js"></script>
<script src="./audio.js"></script>
<script src="./art.js"></script>
<script src="./game.js"></script>
<script>
  // remove the boot splash once the first frame is up
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    var b = document.getElementById("boot"); if (b) b.parentNode.removeChild(b);
  }); });
</script>
</body>
</html>
